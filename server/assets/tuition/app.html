<header>
  <h1>补习中心 · 学费对账 &amp; MT Allowance <span id="conn" class="tag grey">连接中…</span> <span id="langsw" style="float:right;font-size:12px;font-weight:400"></span></h1>

<script>
// ===== Core logic (pure, no DOM) =====
const STOP = new Set(['BIN','BINTI','BT','BTE','AL','AP','MUHAMMAD','MUHAMAD','MOHD','MOHAMAD','MOHAMMAD','MOHAMED','MUHAMMED','NUR','NURUL','NOR','PUTRI','PUTERI','PUTRA','PUTERA','SITI','AHMAD','ABDUL','ABD','SYED','WAN','DAN','YURAN','OCT','OKT','NOV','SEPT','SEP','FEE','FEES','TUISYEN','TUITION','MATH','OCTOBER','OKTOBER','NOVEMBER','SEPTEMBER','DECEMBER','DISEMBER','DEC','HOME','TERAPI','TERAPIMATH','PAYMENT','FOR','FUND','FUNDS','TRANSFER','MONTHLY','BULAN','PAKEJ','MODUL','BARU','MEPS','DUITNOW','TRSF','JULAI','OGOS','ENCIK','PUAN','ANAK']);
function norm(s){ return String(s==null?'':s).toUpperCase().replace(/[^A-Z]/g,''); }
function normA(s){ return String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9]/g,''); }   // for searching: letters and digits (student numbers like B047)
function toks(s){ return (String(s==null?'':s).toUpperCase().match(/[A-Z]+/g)||[]).filter(t=>t.length>=3 && !STOP.has(t)); }
function r2(n){ return Math.round((+n||0)*100)/100; }

// ---- dates ----
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addMonths(m,k){ let [y,mo]=m.split('-').map(Number); mo+=k; while(mo>12){mo-=12;y++;} while(mo<1){mo+=12;y--;} return y+'-'+pad(mo); }
function lastDay(m){ const [y,mo]=m.split('-').map(Number); return ymd(new Date(y,mo,0)); }
function deadlineOf(month){ return lastDay(addMonths(month,2)); }       // 10月 -> 12月31日
function payoutFor(paidDate, month){
  const y=+paidDate.slice(0,4), m=+paidDate.slice(5,7), d=+paidDate.slice(8,10);
  const thisM = y+'-'+pad(m);
  let p = d<=10 ? thisM+'-15' : addMonths(thisM,1)+'-05';
  const earliest = month ? addMonths(month,1)+'-05' : p;
  return p<earliest?earliest:p;
}
function payoutWindow(p){ // which payment dates feed payout p
  const m=p.slice(0,7);
  if(p.endsWith('-15')) return {from:m+'-01', to:m+'-10', label:'收款 '+m+'-01 至 '+m+'-10'};
  const pm=addMonths(m,-1); return {from:pm+'-11', to:lastDay(pm), label:'收款 '+pm+'-11 至 '+lastDay(pm)};
}
function parseDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return ymd(v);
  if(typeof v==='number' && v>20000 && v<80000){ const d=new Date(Math.round((v-25569)*86400000)); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))) return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[1]+'-'+m[2]+'-'+m[3];
  return null;
}
function parseAmt(v){ if(v==null||v==='') return 0; if(typeof v==='number') return v; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }

// ---- which month a payment says it is for ----
const MON={JAN:1,JANUARI:1,JANUARY:1,FEB:2,FEBRUARI:2,FEBRUARY:2,MAC:3,MAR:3,MARCH:3,APR:4,APRIL:4,MEI:5,MAY:5,JUN:6,JUNE:6,JUL:7,JULAI:7,JULY:7,OGOS:8,OGO:8,AUG:8,AUGUST:8,SEP:9,SEPT:9,SEPTEMBER:9,SPE:9,OKT:10,OCT:10,OKTOBER:10,OCTOBER:10,OCTO:10,NOV:11,NOVEMBER:11,DIS:12,DEC:12,DISEMBER:12,DECEMBER:12};
function monthHint(ref, txDate){
  const s=String(ref||'').toUpperCase(); if(!s) return [];
  const ty=+txDate.slice(0,4), tm=+txDate.slice(5,7); const found=[];
  const re=/BULAN\s*(\d{1,2})(?!\d)|([A-Z]+)|(\d{1,2})\s*\/\s*(\d{2,4})/g; let m;
  while((m=re.exec(s))){ let mo=null;
    if(m[1]){ const a=+m[1]; if(a>=1&&a<=12) mo=a; }
    else if(m[2]){ const w=m[2]; mo=MON[w]||null; if(!mo){ for(const k of ['SEPTEMBER','OKTOBER','OCTOBER','NOVEMBER','DISEMBER','DECEMBER','JULAI','OGOS','SEPT','OKT','OCT','NOV']) if(w.endsWith(k)&&w.length<=k.length+4){ mo=MON[k]; break; } } }
    else { const a=+m[3]; if(a>=1&&a<=12) mo=a; }
    if(mo){ let y=ty; if(mo>tm+2) y--; if(mo<tm-9) y++; const k=y+'-'+String(mo).padStart(2,'0'); if(!found.includes(k)) found.push(k); } }
  if(found.length===2 && /[A-Z]\s*[-–]\s*[A-Z]/.test(s)){ const out=[]; let k=found[0]; let guard=0; while(k<=found[1]&&guard++<12){ out.push(k); k=addMonths(k,1);} return out; }
  return found.sort();
}
// ---- package fee / rate ----
const DEFAULT_CLASSES={A:4,B:4,C:8,'A+':4,'B+':8,'C+':2,'S B+(2)':18,'(S)A':4,'(S)C+':4,'DA+':8,'2A+':8,'TRAIL-A+':1};
function stdClasses(state,pkg){ const p=state.packages&&state.packages[pkg]; return (p&&+p.classes)||DEFAULT_CLASSES[pkg]||4; }
function pkgInfo(pk, code){ return (pk && pk[code]) || null; }
function feeFor(state, line, stu){
  const p=pkgInfo(state.packages, line.pkg); if(p && p.fee) return +p.fee;
  if(stu && stu.pkg===line.pkg && stu.price) return +stu.price;
  return 0;
}

// ---- bank file parsing: returns rows {date,time,payer,ref,amount} (credits only) ----
function findHeader(rows, need){
  for(let i=0;i<Math.min(rows.length,60);i++){
    const r=(rows[i]||[]).map(c=>String(c==null?'':c).trim());
    if(need.every(n=>r.some(c=>c.toLowerCase()===n.toLowerCase()))) return {i, cols:r};
  }
  return null;
}
function colIdx(cols,name){ const n=name.toLowerCase(); let i=cols.findIndex(c=>c.toLowerCase()===n); if(i<0) i=cols.findIndex(c=>c.toLowerCase().startsWith(n)); return i; }
function parseBank(rows){
  let h=findHeader(rows,['Transaction Date','Credit']);
  if(h){ // AFFIN
    const c=h.cols, iD=colIdx(c,'Transaction Date'), iT=colIdx(c,'Transaction Time'), iN=colIdx(c,'Name'), iR=colIdx(c,'Recipient Ref No.'), iO=colIdx(c,'Other Payment Details'), iM=colIdx(c,'Remarks'), iC=colIdx(c,'Credit');
    const out=[];
    for(let k=h.i+1;k<rows.length;k++){ const r=rows[k]||[]; const date=parseDate(r[iD]); const amt=parseAmt(r[iC]); if(!date||!(amt>0)) continue;
      let t=r[iT]; if(t instanceof Date) t=pad(t.getHours())+':'+pad(t.getMinutes()); else if(typeof t==='number') { const mins=Math.round(t*1440); t=pad(Math.floor(mins/60))+':'+pad(mins%60);}
      const ref=[r[iR],r[iO],iM>=0?r[iM]:null].filter(x=>x!=null&&String(x).trim()&&String(x).trim()!=='-').map(x=>x instanceof Date?ymd(x):String(x).replace(/\s+/g,' ').trim()).join(' / ');
      out.push({date,time:t?String(t):'',payer:String(r[iN]||'').replace(/\s+/g,' ').trim(),ref,amount:r2(amt)}); }
    return {bank:'AFFIN', rows:out};
  }
  h=findHeader(rows,['Trn. Date','Credit Amount']);
  if(h){ // Public Bank
    const c=h.cols, iD=colIdx(c,'Trn. Date'), iNo=colIdx(c,'Cheque No/Ref No'), iC=colIdx(c,'Credit Amount'), i1=colIdx(c,'Reference 1'), i2=colIdx(c,'Reference 2'), i3=colIdx(c,'Reference 3');
    const out=[];
    for(let k=h.i+1;k<rows.length;k++){ const r=rows[k]||[]; const date=parseDate(r[iD]); const amt=parseAmt(r[iC]); if(!date||!(amt>0)) continue;
      const r1=String(r[i1]||''); const payer=r1.slice(0,25).trim(); const note=r1.slice(25).trim();
      const ref=[note,r[i2],r[i3]].filter(x=>x!=null&&String(x).trim()).map(x=>String(x).replace(/\s+/g,' ').trim()).join(' / ');
      out.push({date,time:String(r[iNo]||''),payer,ref,amount:r2(amt)}); }
    return {bank:'PBB', rows:out};
  }
  return null;
}
function parseBankMapped(rows, map){ // generic: map={header,date,payer,ref,credit}
  const out=[];
  for(let k=map.header+1;k<rows.length;k++){ const r=rows[k]||[]; const date=parseDate(r[map.date]); const amt=parseAmt(r[map.credit]); if(!date||!(amt>0)) continue;
    out.push({date,time:'',payer:String(r[map.payer]||'').replace(/\s+/g,' ').trim(),ref:map.ref>=0?String(r[map.ref]||'').replace(/\s+/g,' ').trim():'',amount:r2(amt)}); }
  return out;
}
function hashStr(s){ let h1=0x811c9dc5,h2=0x1234567; for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,16777619)>>>0; h2=Math.imul(h2^c,2246822507)>>>0; } return h1.toString(36)+h2.toString(36); }
function txIds(bank, rows){ const seen={}; return rows.map(r=>{ const base=[bank,r.date,r.time,norm(r.payer),r.amount.toFixed(2),norm(r.ref)].join('|'); seen[base]=(seen[base]||0)+1; return 't'+hashStr(base+'#'+seen[base]); }); }

// ---- matching ----
// students: array of {uid, no, name, branch, status, parents:[..], pkg, price}
function famKey(s){ return (s.parents||[]).map(norm).filter(p=>p.length>=8); }
function nameScore(refT, name){
  const nt=toks(name); let sc=0;
  for(const a of refT){ for(const b of nt){ if(a===b) sc+=1; else if(a.length>=4&&b.length>=4&&(a.startsWith(b.slice(0,4))&&b.startsWith(a.slice(0,4)))) sc+=0.5; else if(a.length>=6 && b.length>=4 && a.includes(b)) sc+=0.5; } }
  return sc;
}
function studentFee(state, s){ const p=pkgInfo(state.packages,s.pkg); return (p&&p.fee)?+p.fee:(+s.price||0); }
function combos(arr, target, feeOf){
  const res=[]; const n=arr.length; if(n>8) return res;
  for(let mask=1; mask<(1<<n); mask++){ let sum=0; const pick=[]; for(let i=0;i<n;i++) if(mask&(1<<i)){ sum+=feeOf(arr[i]); pick.push(arr[i]); } if(Math.abs(sum-target)<0.01) res.push(pick); }
  return res;
}
// returns {status:'auto'|'review'|'unmatched', how, alloc:[{uid,amt}], sugg:[uid]}
function matchTx(state, tx, pool, paidSet){
  const p=norm(tx.payer); const amt=+tx.amount;
  const feeOf=s=>studentFee(state,s);
  const byUid=Object.fromEntries(pool.map(s=>[s.uid,s]));
  const rk=p+'|'+amt.toFixed(2);
  const rule=state.rules && state.rules.amt && state.rules.amt[rk];
  if(rule && rule.length && rule.every(u=>byUid[u])){
    return {status:'auto', how:'已记住的付款人', alloc:splitAlloc(rule.map(u=>byUid[u]),amt,feeOf), sugg:rule};
  }
  const refT=toks(tx.ref);
  let fam=[], how='';
  const ruleFam = state.rules && state.rules.payer && state.rules.payer[p];
  if(ruleFam && ruleFam.length){ fam=ruleFam.map(u=>byUid[u]).filter(Boolean); how='已记住的家庭'; }
  if(!fam.length && p.length>=8){
    fam=pool.filter(s=>famKey(s).some(pp=>pp.startsWith(p.slice(0,18))||p.startsWith(pp.slice(0,18))));
    how='父母名字';
  }
  if(!fam.length){
    const sc=pool.map(s=>[nameScore(refT,s.name),s]).filter(x=>x[0]>=1).sort((a,b)=>b[0]-a[0]);
    if(sc.length){ const best=sc[0][0]; const top=sc.filter(x=>x[0]===best).map(x=>x[1]);
      if(top.length<=3){ const fks=new Set(top.flatMap(famKey)); fam=pool.filter(s=>top.includes(s)||famKey(s).some(k=>fks.has(k))); how='备注里的学生名'; } }
  }
  if(!fam.length) return {status:'unmatched', how:'找不到', alloc:[], sugg:[]};
  const active=fam.filter(s=>s.status==='Active'); if(active.length) fam=active;
  if(fam.length===1 && how!=='备注里的学生名') return {status:'auto', how, alloc:[{uid:fam[0].uid,amt}], sugg:[fam[0].uid]};
  if(fam.length===1) return {status: how==='备注里的学生名'?(Math.abs(feeOf(fam[0])-amt)<0.01?'auto':'review'):'auto', how, alloc:[{uid:fam[0].uid,amt}], sugg:[fam[0].uid]};
  // several kids: choose by amount
  let cs=combos(fam,amt,feeOf), mult=1;
  for(let k=2;k<=3 && !cs.length;k++){ cs=combos(fam,amt/k,feeOf); if(cs.length) mult=k; }
  const scoreOf=c=>c.reduce((a,s)=>a+nameScore(refT,s.name)-(paidSet&&paidSet.has(s.uid)?3:0),0);
  if(cs.length){
    cs.sort((a,b)=>scoreOf(b)-scoreOf(a));
    const unique = cs.length===1 || scoreOf(cs[0])>scoreOf(cs[1]);
    const pick=cs[0];
    return {status: unique?'auto':'review', how: how+'+金额'+(mult>1?'（'+mult+'个月）':''), alloc:pick.map(s=>({uid:s.uid,amt:r2(feeOf(s)*mult)})), sugg:fam.map(s=>s.uid)};
  }
  // amount doesn't fit any combination: suggest by name in ref
  const named=fam.filter(s=>nameScore(refT,s.name)>=1);
  const pick=named.length?named:fam;
  return {status:'review', how: how+'（金额对不上）', alloc:splitAlloc(pick,amt,feeOf), sugg:fam.map(s=>s.uid)};
}
function splitAlloc(list, amt, feeOf){
  if(list.length===1) return [{uid:list[0].uid, amt}];
  const fees=list.map(feeOf); const tot=fees.reduce((a,b)=>a+b,0);
  let left=amt; return list.map((s,i)=>{ let a = i===list.length-1? r2(left) : r2(tot? amt*fees[i]/tot : amt/list.length); left-=a; return {uid:s.uid, amt:a}; });
}

// ---- ledger: FIFO per student ----
// returns map uid -> {charges:[{month,amount,paid,paidDate,line,deadline}], credit, payments:[...]}
function buildLedger(state){
  const L={}; Object.defineProperty(L,'_tx',{value:{},writable:true,enumerable:false});
  const get=uid=>L[uid]||(L[uid]={charges:[],payments:[],credit:0});
  for(const s of allStudents(state)){
    const o=+s.opening||0;
    if(o>0) get(s.uid).charges.push({month:'期初',amount:o,deadline:null,line:null,opening:true});
    else if(o<0) get(s.uid).payments.push({date:'2000-01-01',amt:-o,txid:'opening',desc:'期初预付'});
  }
  const months=Object.values(state.rosters||{}).filter(r=>r.confirmed).sort((a,b)=>a.month<b.month?-1:1);
  for(const r of months){ for(const ln of r.lines||[]){ if(!ln.uid) continue; const s=findStu(state,ln.uid);
      get(ln.uid).charges.push({month:r.month, branch:r.branch, amount:feeFor(state,ln,s), deadline:r.month>=((state.config&&state.config.ruleStart)||'2026-10')?deadlineOf(r.month):null, line:ln}); } }
  for(const bm of Object.values(state.bank||{})) for(const t of Object.values(bm.tx||{})){
    if(t.status==='ignore'||t.status==='unmatched') continue;
    if(t.status==='review') continue; // not confirmed yet
    for(const a of t.alloc||[]) get(a.uid).payments.push({date:t.date,amt:+a.amt,txid:t.id,desc:t.payer,months:Array.isArray(a.months)?a.months:monthHint(t.ref,t.date),explicit:Array.isArray(a.months)});
  }
  const tuitionFirst = state.config && state.config.payOrder==='tuitionFirst';
  for(const uid in L){ const e=L[uid];
    if(tuitionFirst) e.charges.sort((a,b)=>(a.opening?1:0)-(b.opening?1:0));
    e.payments.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    for(const c of e.charges){ c.paid=0; c.paidDate=null; c.cov=[]; }
    for(const p of e.payments){ p.rem=p.amt; p.applied=[]; }
    const firstMonth=(e.charges.find(c=>!c.opening)||{}).month;
    const apply=(p,c)=>{ const need=r2(c.amount-c.paid); if(need<=0.001||p.rem<=0.001) return; const take=Math.min(need,p.rem); p.rem=r2(p.rem-take); c.paid=r2(c.paid+take); c.cov.push({txid:p.txid,date:p.date,amt:r2(take)}); p.applied.push({month:c.month,amt:r2(take)}); if(c.amount-c.paid<=0.001) c.paidDate=p.date; };
    // phase 1: payments that say which month they are for
    for(const p of e.payments){ for(const m of (p.months||[])){ let c=e.charges.find(x=>x.month===m);
        if(!c && (!firstMonth || m<firstMonth)) c=e.charges.find(x=>x.opening);
        if(c) apply(p,c); } }
    // phase 2: the rest, oldest charge first
    for(const p of e.payments){ for(const c of e.charges){ if(p.rem<=0.001) break; apply(p,c); } }
    for(const c of e.charges){ if(c.amount<=0){ c.paidDate=c.opening?null:'n/a'; } else if(c.paidDate){ c.paidDate=c.cov.reduce((a,x)=>x.date>a?x.date:a,''); } }

}

function outstanding(state, L, today){
  const rows=[];

    for(const c of L[uid].charges){ const owe=r2(c.amount-c.paid); if(owe<=0.001) continue;
      const late = c.deadline && today>c.deadline;
      const daysLeft = c.deadline? Math.round((new Date(c.deadline)-new Date(today))/86400000):null;
      rows.push({uid, s, month:c.month, amount:c.amount, paid:c.paid, owe, deadline:c.deadline, late, daysLeft, mt:(c.line&&c.line.mt)||s.mt||'', branch:c.branch||s.branch}); } }
  rows.sort((a,b)=>(a.branch+a.mt).localeCompare(b.branch+b.mt)||((a.daysLeft??-1e9)-(b.daysLeft??-1e9)));

}

function allowanceLines(state, L){

}

// ---- roster parse (teacher allowance sheet) ----
function parseRoster(rows){
  const lines=[]; let mt=null, inOut=false;
  for(const r of rows){ if(!r) continue; const a=r[0], b=r[1];
    if(typeof a==='string' && /^\s*MT\b/i.test(a)){ mt=a.trim().replace(/\s+/g,' ').toUpperCase(); inOut=false; continue; }
    if(typeof b==='string' && /OUTSTANDING|BANK DETAIL/i.test(b)){ inOut=true; continue; }
    if(!mt||inOut) continue;

      const ticks=r.slice(3).filter(c=>typeof c==='string' && (/[✔✓√]/.test(c) || /^\s*[vV\/]\s*$/.test(c))).length;

}
function matchName(name, list){
  const n=norm(name); let hit=list.find(s=>norm(s.name)===n); if(hit) return {s:hit,exact:true};
  const nt=new Set(toks(name)); let best=null,bs=0;
  for(const s of list){ const st=toks(s.name); if(!st.length) continue; const inter=st.filter(t=>nt.has(t)).length; const sc=inter/Math.max(st.length,nt.size); if(sc>bs){bs=sc;best=s;} }
  return bs>=0.6?{s:best,exact:false,score:bs}:null;
}

    out.push({no, code:String(r[iC]||'').trim(), name, status:st, transferNote, enrolled:parseDate(r[iE])||'', parents:[r[iP1],r[iP2],r[iP3]].filter(x=>x&&String(x).trim()).map(x=>String(x).trim()), mt:String(r[iM]||'').trim(), pkg:String(r[iPk]||'').trim(), price:parseAmt(r[iPr])||0, gender:iG>=0?String(r[iG]||''):''}); }
  return out;
}
// Bukku aged receivables -> {no: amount}
function parseAging(rows){
  const h=findHeader(rows,['Customer','Total']); if(!h) return null; const iCu=colIdx(h.cols,'Customer'), iT=colIdx(h.cols,'Total');

}

async function saveStu(uid,b){

  const old=doc.list[no]||{}; const o0={mt:old.mt||'',pkg:old.pkg||'',status:old.status||''};
  doc.list[no]=Object.assign(old,{code:$('#e_code').value.trim(),name:$('#e_name').value.trim().replace(/\s+/g,' '),gender:$('#e_gender').value,status:$('#e_status').value,mt:$('#e_mt').value.trim(),pkg:$('#e_pkg').value.trim(),parents:$('#e_par').value.split('\n').map(x=>x.trim()).filter(Boolean),opening:+$('#e_open').value||0,startMonth:$('#e_start').value||'',changes:UI._chg||[]});

async function doTransfer(uid){

async function importMaster(input){
  try{ const {wb}=await readFile(input); let rows=null,out=null;
    for(const n of wb.SheetNames){ const r=sheetRows(wb.Sheets[n]); const p=parseMaster(r); if(p&&p.length){ out=p; rows=n; break; } }
    input.value=''; if(!out) return toast('找不到有 CODE / NO / Name 栏的 sheet');
    const b=UI.branch; const doc=JSON.parse(JSON.stringify(S.students[b]||{list:{}})); doc.list=doc.list||{}; let add=0,upd=0;
    for(const s of out){ const {no,transferNote,...rest}=s; if(doc.list[no]){ const o=doc.list[no]; const o0={mt:o.mt||'',pkg:o.pkg||'',status:o.status||''}; Object.assign(o,rest,{opening:o.opening||0,transferTo:o.transferTo,transferFrom:o.transferFrom}); histChanges(o,o0,'导入 master list'); if(!rest.gender) o.gender=o.gender||''; if(transferNote) o.note=transferNote; upd++; } else { doc.list[no]=Object.assign(rest,{opening:0,created:today()}); if(transferNote) doc.list[no].note=transferNote; add++; } }
    await save('students/'+b,doc); toast(`${b}：新增 ${add}，更新 ${upd}（sheet：${rows}）`,4000);
  }catch(e){ input.value=''; toast('读取失败：'+e); }
}
async function importAging(input){
  try{ const {wb}=await readFile(input); let ag=null; for(const n of wb.SheetNames){ ag=parseAging(sheetRows(wb.Sheets[n])); if(ag&&Object.keys(ag).length) break; }
    input.value=''; if(!ag) return toast('找不到 Bukku Aged Receivables（Customer / Total 栏）');
    const b=UI.branch; const doc=JSON.parse(JSON.stringify(S.students[b]||{list:{}})); let n=0, miss=[];
    for(const no in doc.list) doc.list[no].opening=0;
    for(const [no,amt] of Object.entries(ag)){ if(doc.list[no]){ doc.list[no].opening=amt; n++; } else miss.push(no); }
    await save('students/'+b,doc); toast(`期初欠款已更新 ${n} 人${miss.length?'；找不到编号：'+miss.join(', '):''}`,5000);
  }catch(e){ input.value=''; toast('读取失败：'+e); }
}

function rosterDiff(r,prev,isDraft){
  const lines=r.lines||[]; const pm={}; (prev?prev.lines:[]).forEach(l=>{ if(l.uid) pm[l.uid]=l; });
  const cm={}; lines.forEach(l=>{ if(l.uid){ (cm[l.uid]=cm[l.uid]||[]).push(l); } });
  const nw=[],gone=[],pkg=[],mt=[],dup=[],nomaster=[],hq=[],norate=[],zero=[];
  for(const l of lines){ const s=l.uid&&findStu(S,l.uid);
    if(!l.uid){ nomaster.push(l); continue; }
    if(prev && !pm[l.uid]) nw.push(l);
    if(prev && pm[l.uid] && pm[l.uid].pkg!==l.pkg) pkg.push([l,pm[l.uid]]);

async function ingestBank(bank,rows,fname){
  const ids=txIds(bank,rows); const pool=poolFor(bank); const byMonth={}; let dup=0, add=0; const stat={auto:0,review:0,unmatched:0};
  const existing=new Set(); for(const d of Object.values(S.bank)) if(d.bank===bank) Object.keys(d.tx||{}).forEach(k=>existing.add(k));
  rows.forEach((r,i)=>{ const id=ids[i]; if(existing.has(id)){ dup++; return; } const m=r.date.slice(0,7); (byMonth[m]=byMonth[m]||[]).push(Object.assign({id,bank},r)); });
  for(const m of Object.keys(byMonth).sort()){
    const did=bankDocId(bank,m); const doc=JSON.parse(JSON.stringify(S.bank[did]||{bank,month:m,tx:{}})); doc.tx=doc.tx||{};
    const paid=paidSetFor(m);
    for(const t of byMonth[m]){ const r=matchTx(S,t,pool,paid); t.status=r.status; t.how=r.how; t.alloc=r.alloc.map(a=>({uid:a.uid,amt:a.amt})); t.sugg=r.sugg; if(r.status==='auto') r.alloc.forEach(a=>paid.add(a.uid)); stat[r.status]++; doc.tx[t.id]=t; add++; }
    doc.updatedAt=new Date().toISOString(); await save('bank/'+did,doc);
  }
  UI.bBank=bank; const ms=[...new Set(rows.map(r=>r.date.slice(0,7)))].sort(); if(ms.length) UI.bMonth=ms[ms.length-1]; UI.bFilter='need';
  modal(`<h3>银行资料已读入</h3><ul><li>新交易：<b>${add}</b> 笔</li><li>已经上传过（跳过）：${dup} 笔</li><li>✅ 自动配对：${stat.auto}</li><li>🟡 待你确认：${stat.review}</li><li>❓ 找不到学生：${stat.unmatched}</li></ul><button class="b" onclick="closeModal();render()">去处理</button>`);
  render();
}

// ---------- Allowance ----------
function mtKey(b,mt){ return b+'|'+mt; }
// Training fee (the new MTs only): 6 instalments, each in a month; deducted from the allowance paid on the 5th of that month. An instalment month left empty
// continues one month after the one before it. {exempt:true} = old MT, nothing to deduct.
function trainOf(k){ const r=(S.mts.list||{})[k]; return (r&&r.training)||null; }
function trainSched(k){ const t=trainOf(k); if(!t||t.exempt) return null; const ms=t.months||[], out=[]; for(let i=0;i<6;i++){ out.push(ms[i]||(i&&out[i-1]?addMonths(out[i-1],1):'')); } return out; }
// how many instalments were already deducted before payout p (recorded by hand, or scheduled and not skipped): after 6 nothing more is deducted
function trainDoneBefore(k,p){ const rec=(S.mts.list||{})[k]||{}, ded=rec.deductions||[]; let n=ded.filter(d=>d.payout<p&&!d.skip).length; (trainSched(k)||[]).forEach(m=>{ if(m&&m+'-05'<p&&!ded.some(d=>d.payout===m+'-05')) n++; }); return n; }
function trainDue(k,p){ const t=trainOf(k); if(!t||t.exempt||p.slice(8)!=='05'||trainDoneBefore(k,p)>=6) return null; const sch=trainSched(k), i=sch.indexOf(p.slice(0,7)); if(i<0||!(+t.amt>0)) return null; return {n:i+1,amt:+t.amt,bill:t.bill||''}; }
function vAllow(){

  const byMt={}; pay.forEach(x=>{ const k=mtKey(x.branch,x.mt); (byMt[k]=byMt[k]||[]).push(x); });
  const pendMt={}; pend.filter(x=>today()<=x.deadline).forEach(x=>{ const k=mtKey(x.branch,x.mt); (pendMt[k]=pendMt[k]||[]).push(x); });

     <div class="row" style="margin-top:8px;justify-content:flex-end;gap:16px"><span>小计 <b>RM ${money(sub)}</b></span>
      <span>Training fee ${here?(here.skip?`<span class="mute">这期不扣</span> <button class="g" onclick="dedDel('${k}','${p}')">恢复</button>`:`<b>- RM ${money(here.amt)}</b>（${here.n||n}/6，单号 ${esc(here.billNo||'—')}） <button class="g" onclick="dedDel('${k}','${p}')">取消</button>`):due?`<b>- RM ${money(due.amt)}</b>（${due.n}/6，单号 ${esc(due.bill||'—')}，按 training 记录） <button class="g" onclick="dedSkip('${k}','${p}',${due.n})">这期不扣</button>`:exempt?'<span class="mute">TRAINING 不扣</span>':trainDoneBefore(k,p)>=6?'<span class="mute">Training fee 6/6 已扣完</span>':`<button class="g" onclick="dedAdd('${k}','${p}',${n})">扣 training fee（已扣 ${n}/6）</button>`}</span>
      <span>实发 <b style="font-size:16px">RM ${money(net)}</b></span></div>

  return `<div class="card"><div class="row"><span>发放日期</span><select onchange="UI.payout=this.value;render()">${pl.map(x=>`<option ${x===p?'selected':''}>${x}</option>`).join('')}</select>

// ---- one allowance sheet (PDF) for each MT. The file name is DM-[BRANCH]-[MT NAME]-[YYYY]_[MM]-[AMOUNT].pdf (payout month, net amount) ----
function allowSheet(k,p){
  const [b,mt]=k.split('|'); const all=allowanceLines(S,ledger());
  const ls=all.filter(x=>x.status==='payable'&&x.payout===p&&mtKey(x.branch,x.mt)===k).sort((a,c)=>a.month.localeCompare(c.month)||a.s.name.localeCompare(c.s.name));
  const sub=r2(ls.reduce((a,x)=>a+x.amount,0)); const rec=(S.mts.list||{})[k]||{}; const ded=rec.deductions||[]; let here=ded.find(d=>d.payout===p); const n=ded.filter(d=>d.payout<=p&&!d.skip).length;
  if(here&&here.skip) here=null; else if(!here){ const due=trainDue(k,p); if(due) here={amt:due.amt,billNo:due.bill,n:due.n}; }
  const pd=all.filter(x=>x.status==='pending'&&today()<=x.deadline&&mtKey(x.branch,x.mt)===k);
  return {b,mt,ls,sub,here,n,net:r2(sub-(here?+here.amt:0)),pd};
}
function allowPdfName(d,p){ return ('DM-'+d.b+'-'+d.mt.replace(/^MT\s+/i,'')+'-'+p.slice(0,4)+'_'+p.slice(5,7)+'-'+d.net.toFixed(2)+'.pdf').replace(/[\\/:*?"<>|]/g,''); }

function claimAnalysis(c){
  const b=c.branch, m=c.month, rid=rosterId(b,m), ro=S.rosters[rid]||null, stuL=(S.students[b]||{}).list||{};
  const known=c.lines.filter(l=>l.uid&&stuL[l.uid.split(':')[1]]);
  const merged=((ro&&ro.lines)||[]).filter(l=>l.mt!==c.mt).concat(known.map(l=>({mt:c.mt,pkg:l.pkg,uid:l.uid,classes:l.dates.length})));
  const st2=Object.assign({},S,{rosters:Object.assign({},S.rosters,{[rid]:{lines:merged,month:m,branch:b,confirmed:true}})});
  const al=allowanceLines(st2,buildLedger(st2)).filter(x=>x.month===m&&x.mt===c.mt), by={}; al.forEach(x=>{ by[x.uid]=x; });
  const rows=c.lines.map((l,i)=>{
    const s=l.uid?findStu(S,l.uid):null, sys=l.uid?by[l.uid]:null, p=S.packages[l.pkg]||{}, classes=(l.dates||[]).length, rate=+p.rate||0, flags=[];
    if(!s) flags.push({t:'bad',x:'新学生，不在名单里'});
    else { if((s.pkg||'')!==l.pkg) flags.push({t:'warn',x:'Master 的 package 是 '+(s.pkg||'（没有）')}); if((s.mt||'')!==c.mt) flags.push({t:'warn',x:'Master 的 MT 是 '+(s.mt||'（没有）')}); }

async function hqSave(exp,force){

  for(const l of h.lines){ if(l.newStudent&&!l.uid&&!l.skip&&invoiced(l.kind)){
    const dup=Object.entries(sd.list).find(([no,s])=>norm(s.name)===norm(l.client)); if(dup){ l.uid=h.branch+':'+dup[0]; l.newStudent=false; continue; }
    const no=nextNoIn(sd.list,h.branch); sd.list[no]={code:'',name:String(l.client).replace(/\s+/g,' ').trim().toUpperCase(),status:'Registered',enrolled:h.date,mt:'',pkg:'',price:0,parents:[],opening:0,gender:l.gender||'',created:today(),history:[{d:today(),t:'status',from:'',to:'Registered',note:'HQ 单 '+h.invoiceNo}]};
    l.uid=h.branch+':'+no; l.newStudent=false; added++; } }
  if(added) await save('students/'+h.branch,sd);
  const doc=Object.assign({},h,{savedAt:new Date().toISOString()}); delete doc.id; const id=h.branch+'_'+h.invoiceNo;
  if(exp){ const r=hqExportRows(doc);
    if(r.bad.length&&!force){ await save('hqbills/'+id,doc); UI._hq=Object.assign(doc,{id}); return exportGate(r.bad.length+' 行不会开单。',r.bad,r.rows.length,'hqSave(true,true)'); }
    doc.exportedAt=today(); await save('hqbills/'+id,doc); UI._hq=Object.assign(doc,{id}); hqDownload(doc,r); }
  else { await save('hqbills/'+id,doc); closeModal(); toast('已保存'+(added?'，新学生 '+added+' 个已加进学生名单，状态「已报名」（要补 Bukku code；package 和 MT 等上课前决定了再填）':''),5000); }
}
function hqExportRows(d){

    if(!s){ bad.push(l.client+'：找不到学生'); continue; } if(!s.code){ bad.push(s.no+' '+s.name+'：没有 Bukku code'); continue; } if(!(l.price>0)){ bad.push(s.no+' '+s.name+'：售价是 0'); continue; }

function feeStudents(b,m){ return stuList(b).filter(s=>s.status==='Active'&&(!s.startMonth||s.startMonth<=m)&&(!s.enrolled||String(s.enrolled).slice(0,7)<=m)).sort((x,y)=>x.no.localeCompare(y.no,undefined,{numeric:true})); }
function exportInvoices(force){ const b=UI.invBranch||'BBU', m=UI.invMonth||UI.expMonth;
  const c=cfg().inv; const mm=m.slice(5,7), yy=m.slice(2,4); const fill=s=>String(s||'').replace(/\{B\}/g,b).replace(/\{MM\}/g,mm).replace(/\{YY\}/g,yy);
  const date='01/'+mm+'/'+m.slice(0,4); const rows=[], bad=[]; const act=feeStudents(b,m);
  if(!act.length) return toast(b+' '+m+' 没有 Active 学生');
  for(const s of act){ const pkg=pkgOnMonth(s,m), fee=feeFor(S,{pkg},s);
    if(!(fee>0)){ bad.push(s.no+' '+s.name+'：package '+(pkg||'（没有）')+' 没有学费'); continue; } if(!s.code){ bad.push(s.no+' '+s.name+'：没有 Bukku code'); continue; }
    rows.push([s.code,s.no+'-'+s.name,fill(c.number),s.no,date,null,null,null,null,b,null,null,c.product||null,fill(c.account),fill(c.desc)+' - '+s.no+' '+s.name+' ('+pkg+')',1,null,null,fee,null,c.tax||null,null,null]); }
  // compared with the confirmed teacher roster of that month (information only)
  const ro=S.rosters[rosterId(b,m)], diff=[];
  if(ro&&ro.confirmed){ const onRo=new Set((ro.lines||[]).map(l=>l.uid)), actSet=new Set(act.map(s=>s.uid));
    act.filter(s=>!onRo.has(s.uid)).forEach(s=>diff.push(s.no+' '+s.name+'：Active，但不在这个月的老师名单里'));
    [...onRo].filter(u=>!actSet.has(u)).forEach(u=>{ const s=findStu(S,u); diff.push((s?s.no+' '+s.name:u)+'：在老师名单里，但不是 Active（或还没开始上课）'); }); }
  if((bad.length||diff.length)&&!force) return exportGate((bad.length?bad.length+' 个学生不会开单（没有 Bukku code，或学费是 0）。':'')+(diff.length?diff.length+' 个学生跟这个月的老师名单不一样。':''),bad.concat(diff),rows.length,'exportInvoices(true)');
  if(!rows.length) return toast('没有可以导出的学生');
  bukkuFile('invoice',rows,`DM-Bukku-Sales Invoice-${b}-${m.slice(0,4)}_${mm}.xlsx`);
  notExported(`DM-Bukku-Sales Invoice-${b}-${m.slice(0,4)}_${mm}-没有导出.xlsx`,'没有导出的学生',bad.concat(diff.map(x=>'（跟老师名单不一样）'+x)));
  if(bad.length) modal(`<h3>${bad.length} 个学生没有导出</h3><div class="small">${bad.map(esc).join('<br>')}</div><p class="small mute">补好资料后再导出一次（这份清单也存成另一个小 Excel 了）。</p>${diff.length?`<div class="small" style="margin-top:8px"><b>跟老师名单不一样：</b><br>${diff.map(esc).join('<br>')}</div>`:''}<button class="g" onclick="closeModal()">关闭</button>`); else if(diff.length) toast(diff.length+' 个学生跟老师名单不一样（清单在另一个小 Excel 里）',5000); }
async function cfgSet(g,b,v){ const c=JSON.parse(JSON.stringify(cfg())); c[g][b]=v; await save('settings/config',c); toast('已保存'); }
// a Bukku import file: the server fills Bukku's own template with these rows (cells from column B on)
async function bukkuFile(type,rows,filename){
  try{
    const r=await fetch(API+'/bukku-file',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,rows})});
    if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error||('请求失败 ('+r.status+')')); }
    const url=URL.createObjectURL(await r.blob()), a=document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),30000);
  }catch(e){ toast('下载失败：'+(e&&e.message||e),6000); }
}
// the list of what was not exported goes into a small file of its own (the import file only holds invoices / payments)
// shown instead of exporting when some invoices / receipts would be left out: fix the data first, or export the rest on purpose
function exportGate(msg,items,okN,go){
  modal(`<h3>导出前检查</h3><div class="msg warn">${msg}请先检查、补好资料再导出，不然会漏开单。</div>
   <div class="small" style="max-height:50vh;overflow:auto">${items.map(esc).join('<br>')}</div>
   <div class="row" style="margin-top:12px"><button class="b" onclick="closeModal()">先去补资料</button><button class="g" onclick="closeModal();${go}">仍然导出其余 ${okN} 张</button></div>`);
}
function notExported(filename,title,lines){ if(lines.length) saveXlsx(filename,[[title,[[title],...lines.map(x=>[x])]]]); }
function dmy(d){ return d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4); }
function exportPayments(force){
  const bank=UI.expBank, m=UI.expMonth; const doc=S.bank[bankDocId(bank,m)]; if(!doc) return toast('这个月没有 '+bank+' 资料');
  const c=cfg(); const tx=Object.values(doc.tx||{}).filter(t=>t.status==='auto'||t.status==='manual').sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1);
  const need=Object.values(doc.tx||{}).filter(t=>t.status==='review'||t.status==='unmatched').length;
  const rows=[]; for(const t of tx) for(const a of t.alloc){ const s=findStu(S,a.uid); if(!s) continue; rows.push([s.code,s.no+'-'+s.name,'OR-'+s.branch+'[YY][MM]-[3DIGIT]',null,dmy(t.date),null,null,a.amt,c.payMethod[bank],c.deposit[bank],null,null,s.branch,(t.payer+' '+(t.ref||'')).slice(0,200),null,null]); }
  if(need&&!force) return exportGate(need+' 笔待处理的银行入账还没有配对，不会导出，会少开 receipt。',Object.values(doc.tx||{}).filter(t=>t.status==='review'||t.status==='unmatched').map(t=>t.date+' '+t.payer+' RM '+money(t.amount)),rows.length,'exportPayments(true)');
  if(!rows.length) return toast('没有可以导出的入账');
  bukkuFile('payment',rows,`DM-Bukku-Sales Payment-${bank}-${m.slice(0,4)}_${m.slice(5,7)}.xlsx`);
}
function exportOnly(){
  return `<div class="card"><div class="msg warn">价目表、Allowance 设定和银行 / 发票设置只有 CC admin 可以改。导出在下面。</div></div>
  <div class="card"><h2>导出 Bukku Sales Invoice（每月学费）</h2><div class="row">
   <select onchange="UI.invBranch=this.value">${brOpts(UI.invBranch||'BBU')}</select>
   <input type="month" value="${UI.invMonth||UI.expMonth}" onchange="UI.invMonth=this.value"><button class="b" onclick="exportInvoices()">下载 Bukku import 文件</button></div>
   <div class="small mute" style="margin-top:6px">选 branch 和月份，系统自动取这个 branch 所有 Active 学生：一个学生一张 invoice，金额 = Master 里的 package 学费。</div></div>
  <div class="card"><h2>导出 Bukku Sales Payment</h2><div class="row">
   <select onchange="UI.expBank=this.value">${['AFFIN','PBB'].map(x=>`<option ${x===UI.expBank?'selected':''}>${x}</option>`).join('')}</select>
   <input type="month" value="${UI.expMonth}" onchange="UI.expMonth=this.value"><button class="b" onclick="exportPayments()">下载 Bukku import 文件</button></div></div>`;
}
const _vSet=vSet;
vSet=function(){ return ADMINP ? _vSet() : MGR ? exportOnly() : '<div class="card"><div class="msg warn">价目表、Allowance 设定和银行 / 发票设置只有 manager 可以改。需要改的话请找 CC CREST manager。</div></div>'; };
init();
</script>
